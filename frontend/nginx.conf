# Serves the built Vite bundle. Goes to /etc/nginx/conf.d/default.conf, replacing
# the image's own server block.
#
# Caddy terminates TLS, compresses, and proxies /api and /img to the API before
# anything reaches here, so this file only ever sees requests for static files and
# client-side routes. See Caddyfile.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No gzip: Caddy already does `encode zstd gzip` on the way out, and compressing
    # twice only costs CPU.

    # For the compose healthcheck. access_log off keeps a 4-per-minute probe out of
    # the log.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite puts a content hash in every filename here, so a changed file gets a new
    # name and this can be cached forever. No try_files: a missing /assets/x.js
    # should 404, not quietly return HTML that the browser then fails to parse as
    # JavaScript.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell must not be cached. It names the hashed bundles above, so a stale
    # copy points at files that no longer exist and the app loads to a blank page.
    #
    # This also covers the fallback below: try_files does an internal redirect, and
    # that re-runs location matching.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback, and the reason this file exists. The routes live only in
    # frontend/src/main.tsx, so without it a reload on /collections/favorites or
    # /people/elenarostova asks nginx for a file that was never built and gets 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
