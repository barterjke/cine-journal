[package]
name = "cine-journal-api"
version = "0.1.0"
edition = "2021"
description = "Read-only JSON API serving the CinéJournal demo data"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13.4", features = ["json", "form"] }
rusqlite = { version = "0.40", features = ["bundled"] }
dotenvy = "0.15.7"
serde_json = "1.0.151"
redis = { version = "1.5.0", features = ["connection-manager", "tokio-comp"] }
getrandom = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

